
# bicep-validate.yml
#
# Purpose: az bicep build + lint (no Azure login needed) always run;
# `what-if` (needs Azure login) additionally runs on PRs so reviewers see
# the actual plan before merge.
#
# Requires three repository secrets for the what-if job's OIDC login
# (federated credential, no client secret) — see
# docs/deployment/deployment-guide.md for how DEV's values were obtained:
#   AZURE_CLIENT_ID        — the GitHub Actions app registration's client ID
#   AZURE_TENANT_ID         — the Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID   — the target subscription ID
# and two more for the intake-processor template's @secure() parameters:
#   INTAKE_PROCESSOR_STORAGE_CONNECTION_STRING
#   MERCURY_API_KEY
# If AZURE_CLIENT_ID isn't set yet, the build+lint job still runs and still
# gates PRs; only the what-if job is skipped (see its `if:` condition).

name: Bicep Validate

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/bicep/**'
      - 'deployment/**'
      - '.github/workflows/bicep-validate.yml'
  pull_request:
    paths:
      - 'infrastructure/bicep/**'
      - 'deployment/**'
      - '.github/workflows/bicep-validate.yml'
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # required for azure/login's OIDC federated credential exchange
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/bicep
    steps:
      - uses: actions/checkout@v4

      - name: Install/upgrade the Bicep CLI
        run: az bicep install

      - name: az bicep build (intake-processor.bicep)
        run: az bicep build --file intake-processor.bicep

      - name: az bicep lint (intake-processor.bicep)
        run: az bicep lint --file intake-processor.bicep

      - name: az bicep build (main.bicep)
        run: az bicep build --file main.bicep

      - name: az bicep lint (main.bicep)
        run: az bicep lint --file main.bicep

  what-if-intake-processor:
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != ''
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: what-if — intake-processor
        working-directory: infrastructure/bicep
        run: |
          az deployment group what-if \
            --resource-group rsbc-dmer-ai-optimization-rg \
            --template-file intake-processor.bicep \
            --parameters @../../deployment/dev/intake-processor.parameters.json \
            --parameters storageAccountConnectionString="${{ secrets.INTAKE_PROCESSOR_STORAGE_CONNECTION_STRING }}" \
            --parameters mercuryApiKey="${{ secrets.MERCURY_API_KEY }}"
