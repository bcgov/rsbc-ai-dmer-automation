
# pr-validation.yml
#
# Purpose: Aggregate build, test, lint, bicep-validate, and security-scan
# into one required status check for branch protection, rather than
# needing to list (and keep in sync) every individual workflow there.
#
# Each of the five is also independently triggered by its own workflow
# file on push/PR — this workflow just calls the same files as reusable
# workflows (`uses:`) so their pass/fail rolls up into the single
# `required-checks-passed` job below. Point main's branch protection rule
# at that one job.

name: Pr Validation

on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    uses: ./.github/workflows/test.yml

  lint:
    uses: ./.github/workflows/lint.yml

  bicep-validate:
    uses: ./.github/workflows/bicep-validate.yml
    secrets: inherit # pragma: allowlist secret -- passes this workflow's own secrets through, not a credential itself

  security-scan:
    uses: ./.github/workflows/security-scan.yml

  required-checks-passed:
    runs-on: ubuntu-latest
    needs: [build, test, lint, bicep-validate, security-scan]
    if: always()
    steps:
      - name: Fail if any required check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required checks did not pass:"
          echo '${{ toJson(needs) }}'
          exit 1
