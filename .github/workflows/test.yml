
# test.yml
#
# Purpose: Run unit tests per service, with coverage reporting.
#
# Currently wired for intake-processor only — see build.yml's header for
# the same incremental-buildout convention. No coverage *gate* (hard
# failure threshold) yet; add one once there's enough test surface for a
# threshold to mean something rather than just chasing a number.

name: Test

on:
  push:
    branches: [main]
    paths:
      - 'services/intake-processor/**'
      - 'requirements-dev.txt'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'services/intake-processor/**'
      - 'requirements-dev.txt'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  intake-processor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intake-processor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install service + test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.4 pytest-cov==6.0.0

      - name: Run unit tests
        run: pytest tests/unit --cov=. --cov-report=term-missing -v
