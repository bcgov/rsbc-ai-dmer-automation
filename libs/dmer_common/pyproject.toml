[project]
name = "dmer-common"
version = "0.1.0"
description = "Shared library for RSBC DMER Automation services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "azure-storage-blob>=12.19,<13",
    "azure-identity>=1.16,<2",
    "azure-servicebus>=7.12,<8",
    "azure-ai-documentintelligence>=1.0,<2",
    "openai>=1.40",
    "tenacity>=8,<10",
    "SQLAlchemy>=2.0,<3",
    "asyncpg>=0.29",
    "python-dateutil>=2.8,<3",
    # GoRules ZEN. Pinned to a minor: rules.json was written and tested against
    # 0.51's expression semantics (null comparisons, date units).
    "zen-engine>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
