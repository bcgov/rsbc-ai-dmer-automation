[project]
name = "dmer-common"
version = "0.1.0"
description = "Shared library for RSBC DMER Automation services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "azure-storage-blob>=12.19,<13",
    "azure-identity>=1.16,<2",
    "azure-servicebus>=7.12,<8",
    "azure-ai-documentintelligence>=1.0,<2",
    "openai>=1.40",
    "tenacity>=8,<10",
    # [asyncio] pulls in greenlet, which the async engine needs; plain
    # SQLAlchemy no longer installs it, and without it the service fails at
    # import ("requires that the Python 'greenlet' library is installed").
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "python-dateutil>=2.8,<3",
    # GoRules ZEN. Pinned to a minor: rules.json was written and tested against
    # 0.51's expression semantics (null comparisons, date units).
    "zen-engine>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# The triage LLM's policy text (dmer_common.triage.policy_text): only the
# workflow orchestrator converts the procedures PDF, so the other services
# don't install pdfplumber. MIT licensed (PyMuPDF, used in the POC, is AGPL).
# 0.11.9: 0.11.10 requires Pillow>=12.2, and di-processor pins Pillow<12; the
# converted text is identical with both.
triage = [
    "pdfplumber==0.11.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
