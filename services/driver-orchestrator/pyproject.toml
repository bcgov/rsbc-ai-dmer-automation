[project]
name = "driver-orchestrator"
version = "0.1.0"
description = "Stage 4 per-driver join: Decision Gateway + Post-Processing. See docs/development/stages/06-driver-orchestration.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
