[project]
name = "reliability"
version = "0.1.0"
description = "Reliability components (architecture 4.6): the Outbox Publisher, the DLQ Drain and the Reconciliation Sweeper. See docs/development/stages/09-reliability-components.md and 10-dlq-drain.md"
requires-python = ">=3.12"
dependencies = [
    "dmer-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
